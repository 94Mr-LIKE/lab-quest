<title>瘋狂實驗室（開發中）</title>
<style>
  body { margin: 0; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #0f1b26; color: #f1ece2; line-height: 1.7; }

  p { margin: 6px 0 16px; color: #c9c3b6; }
  a.go { display: block; margin: 18px 0 12px; padding: 16px 20px; border-radius: 14px; background: #f2b544; color: #14202b; text-decoration: none; font-size: 20px; font-weight: 900; letter-spacing: .1em; text-align: center; }
  a.go2 { display: block; margin: 0 0 12px; padding: 13px 20px; border-radius: 14px; border: 1.5px solid #5d6b78; color: #f1ece2; text-decoration: none; font-size: 17px; font-weight: 700; text-align: center; }

<body>
<main>
  <h1>瘋狂實驗室</h1>
  <div class="rule"></div>
  <p>國小到高中的自然科實驗解謎遊戲，正在開發中。每一關給你一個目標，自己挑器材、決定數量和順序，把實驗做成功。</p>
  <p class="count" id="playerCount" hidden></p>
  <a class="go" href="prototype/">試玩原型</a>
  <a class="go2" href="prototype/cover/index.html">封面與主題曲</a>

</main>
<script src="prototype/common/counter.js"></script>
