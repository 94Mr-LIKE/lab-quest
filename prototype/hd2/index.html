<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0c08">
<link rel="icon" href="data:,">
<title>畫質樣本｜HD-2D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f0c08; overflow: hidden; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; display: block; }
  .hud { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); color: #f4ead3; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .hud b { display: block; font-size: 15px; letter-spacing: .12em; }
  .hud span { font-size: 12px; opacity: .85; }
  .btns { position: fixed; right: max(10px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); display: flex; gap: 6px; z-index: 5; }
  .btns button, .btns a { height: 34px; line-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid rgba(244,234,211,.4); background: rgba(15,12,8,.55); color: #f4ead3; font-size: 13px; font-family: inherit; text-decoration: none; box-sizing: border-box; }
  #sub { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 86%; padding: 8px 16px; border-radius: 8px; background: rgba(10,8,5,.62); color: #f4ead3; font-size: 16px; line-height: 1.5; text-align: center; opacity: 0; transition: opacity .6s; pointer-events: none; }
  #sub.on { opacity: 1; }
  #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(244,234,211,.45); background: rgba(15,12,8,.25); pointer-events: none; display: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(244,234,211,.75); }
  #jump { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(244,234,211,.8); background: rgba(224,130,43,.75); color: #fff; font-size: 22px; font-weight: 800; font-family: inherit; z-index: 5; box-shadow: 0 4px 0 rgba(0,0,0,.35); touch-action: none; }
  #jump.down { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  @media (hover: hover) and (pointer: fine) { #jump { width: 60px; height: 60px; font-size: 18px; } }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: #f4ead3; font-size: 15px; background: #0f0c08; transition: opacity .8s; z-index: 9; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }</script>
</head>
<body>
<div class="hud"><b>畫質樣本｜HD-2D</b><span>輕推搖桿走路、推到底跑步、按「跳」跳躍（電腦：方向鍵＋Shift 跑＋空白鍵跳）</span></div>
<div class="btns"><button id="fx">特效：開</button><button id="fps">0 fps</button><a href="../../index.html">首頁</a></div>
<button id="jump" aria-label="跳">跳</button>
<div id="stick"><div id="knob"></div></div>
<div id="sub"></div>
<div id="load">載入中…</div>
<script src="art/manifest.js"></script>
<script type="module" src="hd2.js"></script>
</body>
</html>
